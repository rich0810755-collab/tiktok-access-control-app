
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>TikTok Access Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101010;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #191919;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    h1 { margin: 0 0 12px; font-size: 25px; }

    .description {
      color: #bbb;
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      margin: 24px 0 16px;
      padding: 18px 14px;
      border-radius: 12px;
      background: #252525;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #fe2c55;
      color: white;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary { background: #292929; }

    .hidden { display: none; }

    .footer {
      margin-top: 22px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">♪</div>
    <h1>TikTok Access Control</h1>

    <p class="description">
      Check your access status or submit an access request below.
    </p>

    <div class="status" id="status" role="status" aria-live="polite">
      Connecting securely to TikTok Access Control...
    </div>

    <button class="button" id="requestButton" onclick="requestAccess()">
      Request Access
    </button>

    <button class="button secondary" id="refreshButton" onclick="checkStatus()">
      Check Access Status
    </button>

    <a class="button secondary" href="https://t.me/Yangyang_pvt">
      Contact on Telegram
    </a>

    <a class="button secondary" href="https://wa.me/15795651739">
      Contact on WhatsApp
    </a>

    <p class="footer">TikTok Access Control</p>
  </main>

  <script>
    const WORKER_URL =
      "https://tiktok-access-control.rich0810755.workers.dev";

    const tg = window.Telegram?.WebApp;
    const statusBox = document.getElementById("status");
    const requestButton = document.getElementById("requestButton");
    const refreshButton = document.getElementById("refreshButton");

    if (tg) {
      tg.ready();
      tg.expand();
    }

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function setLoading(loading) {
      requestButton.disabled = loading;
      refreshButton.disabled = loading;
    }

    async function api(action) {
      if (!tg || !tg.initData) {
        throw new Error(
          "Please open this app using the Open TikTok Access App button in Telegram."
        );
      }

      const response = await fetch(WORKER_URL + "/api/" + action, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: tg.initData })
      });

      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error("The server returned an invalid response.");
      }

      if (!response.ok || !data.ok) {
        throw new Error(data.error || "Unable to complete your request.");
      }

      return data;
    }

    function displayResult(data) {
      if (data.status === "approved") {
        showStatus(
          "✅ ACCESS GRANTED\n\n" +
          "Welcome! Your TikTok access has been approved."
        );
        requestButton.classList.add("hidden");
      } else if (data.status === "pending") {
        showStatus(
          "⏳ REQUEST PENDING\n\n" +
          "Your access request is waiting for administrator approval."
        );
        requestButton.classList.remove("hidden");
      } else {
        showStatus(
          "🔒 ACCESS NOT APPROVED\n\n" +
          "Submit an access request or contact support for assistance."
        );
        requestButton.classList.remove("hidden");
      }
    }

    async function checkStatus() {
      setLoading(true);
      showStatus("Checking your access status...");

      try {
        const data = await api("status");
        displayResult(data);
      } catch (error) {
        showStatus(error.message);
      } finally {
        setLoading(false);
      }
    }

    async function requestAccess() {
      setLoading(true);
      showStatus("Submitting your access request...");

      try {
        const data = await api("request");
        displayResult(data);

        if (data.status === "pending") {
          showStatus(
            "✅ REQUEST SUBMITTED\n\n" +
            "Your request has been sent to the administrator. " +
            "Please check back later."
          );
        }
      } catch (error) {
        showStatus(error.message);
      } finally {
        setLoading(false);
      }
    }

    if (tg?.initData) {
      checkStatus();
    } else {
      showStatus(
        "Open this Mini App from your TikTok Telegram bot to check or request access."
      );
    }
  </script>
</body>
</html>
