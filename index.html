
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <title>TikTok Access Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 18px;
      min-height: 100vh;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #181818;
      text-align: center;
    }
    .logo {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #bbb; line-height: 1.6; font-size: 15px; }
    .status {
      margin: 24px 0;
      padding: 16px;
      border-radius: 12px;
      background: #252525;
      line-height: 1.5;
    }
    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #fe2c55;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .secondary { background: #292929; }
    .small { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">♪</div>
    <h1>TikTok Access</h1>
    <p>Access to this service requires approval from the administrator.</p>

    <div class="status" id="status">
      Connecting to Telegram...
    </div>

    <button class="button" id="request" onclick="requestAccess()">
      Request Access
    </button>

    <a class="button secondary" href="https://t.me/Yangyang_pvt">
      Contact on Telegram
    </a>

    <a class="button secondary" href="https://wa.me/15795651739">
      Contact on WhatsApp
    </a>

    <p class="small">TikTok Access Control</p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const statusBox = document.getElementById("status");

    function requestAccess() {
      if (!tg || !tg.initDataUnsafe?.user?.id) {
        statusBox.textContent =
          "Please open this page using the Open App button in our Telegram bot.";
        return;
      }

      statusBox.textContent =
        "Your Telegram ID is " + tg.initDataUnsafe.user.id +
        ". Access verification will be connected in the next setup step.";
    }

    if (tg?.initDataUnsafe?.user?.id) {
      statusBox.textContent =
        "Welcome! Your Telegram account is detected. Press Request Access to continue.";
    } else {
      statusBox.textContent =
        "Open this Mini App through the Telegram bot to identify your account.";
    }
  </script>
</body>
</html>
